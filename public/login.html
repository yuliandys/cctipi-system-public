<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#eef3f8">
  <title>Masuk — CCTipi System</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 20px;
      overflow: auto;
    }

    .login-wrap {
      width: min(420px, 100%);
      display: flex;
      flex-direction: column;
      gap: 18px;
      animation: rise-in 0.5s var(--ease) both;
    }

    .login-top {
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding: 0 6px;
    }

    .login-top .wordmark {
      font-size: 34px;
    }

    .login-top .eyebrow {
      display: block;
      margin-bottom: 4px;
    }

    .login-top h1 {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -0.035em;
      line-height: 1.1;
    }

    .login-top p {
      margin-top: 6px;
      color: var(--ink-2);
      font-size: 14px;
    }

    .login-card {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 24px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-xl);
      box-shadow: var(--shadow-2);
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .login-form .source-field input {
      height: 50px;
      font-size: 15px;
      border-radius: var(--r);
    }

    .login-btn {
      height: 52px;
      margin-top: 4px;
      border: 0;
      border-radius: var(--pill);
      background: var(--navy);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      transition: background var(--t-fast), transform var(--t-fast), box-shadow var(--t-fast);
    }

    .login-btn:hover {
      background: var(--navy-2);
      box-shadow: 0 8px 20px rgba(11, 42, 69, 0.22);
    }

    .login-btn:active {
      transform: scale(0.98);
    }

    .login-error {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-radius: var(--r);
      background: var(--danger-soft);
      color: var(--danger-ink);
      font-size: 13px;
      font-weight: 500;
      animation: rise-in var(--t) var(--ease) both;
    }

    .login-error.show {
      display: flex;
    }

    .privacy-card {
      padding: 16px 18px;
    }

    .login-hint {
      color: var(--ink-3);
      font-size: 12.5px;
      text-align: center;
      line-height: 1.6;
    }

    .login-hint code {
      padding: 2px 7px;
      border-radius: 6px;
      background: var(--surface);
      color: var(--ink-2);
      font-family: var(--mono);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" class="sprite" aria-hidden="true">
    <symbol id="i-video" viewBox="0 0 24 24"><path d="m16 13 5.2 3.5a.5.5 0 0 0 .8-.4V7.9a.5.5 0 0 0-.8-.4L16 11"/><rect x="2" y="6" width="14" height="12" rx="2"/></symbol>
    <symbol id="logo-mark" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="scr-s" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f8a6b"/>
      <stop offset="1" stop-color="#0d4d63"/>
    </linearGradient>
    <radialGradient id="lens-s" cx="0.38" cy="0.34" r="0.75">
      <stop offset="0" stop-color="#1d5a7a"/>
      <stop offset="0.55" stop-color="#0a2236"/>
      <stop offset="1" stop-color="#06121e"/>
    </radialGradient>
  </defs>
  <g fill="none" stroke="#0b2a45" stroke-width="5" stroke-linecap="round">
    <path d="M48 23 L33 9"/>
    <path d="M48 23 L62 7"/>
  </g>
  <circle cx="33" cy="9" r="4" fill="#0b2a45"/>
  <circle cx="62" cy="7" r="4" fill="#5ff0b8"/>
  <rect x="7" y="21" width="82" height="64" rx="21" fill="#0b2a45"/>
  <rect x="25" y="84" width="10" height="7" rx="3" fill="#0b2a45"/>
  <rect x="61" y="84" width="10" height="7" rx="3" fill="#0b2a45"/>
  <rect x="15" y="29" width="66" height="48" rx="14" fill="url(#scr-s)"/>
  <circle cx="48" cy="53" r="18" fill="#ffffff" fill-opacity="0.14"/>
  <circle cx="48" cy="53" r="15" fill="url(#lens-s)" stroke="#ffffff" stroke-width="3.2"/>
  <circle cx="48" cy="53" r="6.5" fill="#0f3550"/>
  <circle cx="43.5" cy="48.5" r="3" fill="#ffffff" fill-opacity="0.9"/>
  <circle cx="71" cy="38" r="4.6" fill="#5ff0b8"/>
  <circle cx="71" cy="38" r="4.6" fill="none" stroke="#0b2a45" stroke-opacity="0.35" stroke-width="1.5"/>
      </symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 22s8-3.5 8-10V5l-8-3-8 3v7c0 6.5 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="m21.7 18-8-14a2 2 0 0 0-3.5 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3Z"/><path d="M12 9v4M12 17h.01"/></symbol>
  </svg>

  <main class="login-wrap">
    <div class="login-top">
      <span class="login-brand"><svg class="brand-logo" aria-hidden="true"><use href="#logo-mark"/></svg><span class="wordmark">CCTipi<span class="wordmark-dot"></span></span></span>
      <div>
        <span id="greeting" class="eyebrow">Selamat datang</span>
        <h1>Masuk</h1>
        <p>Buka pusat pantau CCTV multiview.</p>
      </div>
    </div>

    <div class="login-card">
      <div id="login-error" class="login-error" role="alert">
        <svg class="ic"><use href="#i-alert"/></svg>
        <span id="login-error-text"></span>
      </div>

      <form id="login-form" class="login-form">
        <label class="source-field">
          <span>Username</span>
          <input type="text" id="username" autocomplete="username" required autofocus placeholder="admin">
        </label>
        <label class="source-field">
          <span>Password</span>
          <input type="password" id="password" autocomplete="current-password" required placeholder="••••••••">
        </label>
        <button type="submit" id="login-submit" class="login-btn">Masuk</button>
      </form>
    </div>

    <div class="privacy-card">
      <span class="privacy-icon"><svg class="ic"><use href="#i-shield"/></svg></span>
      <div>
        <strong>Akses pribadi</strong>
        <p>Sesi tersimpan di server dan berlaku 7 hari. Tombol Keluar mencabut sesi.</p>
      </div>
    </div>

    <p class="login-hint">
      Login awal <code>admin</code> / <code>cctipi123</code> — wajib diganti di Pengaturan → Akun login setelah masuk.
    </p>
  </main>

  <script src="/login.js"></script>
</body>
</html>
